<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corredor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="palco" aria-label="Corredor desenhado a nanquim; role para andar, use WASD para andar livre e clique nas portas para entrar nas salas"></div>
  <div id="rolagem"></div>

  <div class="assinatura">Murilo <span>· corredor</span></div>
  <div class="sala" id="sala"></div>
  <div class="controles">
    <button id="modo" type="button">[WASD] andar livre</button>
    <div class="dicas-livre" id="dicasLivre" hidden>mouse olha · shift corre · clique interage · esc solta o mouse</div>
  </div>
  <button class="voltar" id="voltar" type="button" hidden>← voltar ao corredor</button>
  <button class="som" id="som" type="button" aria-pressed="true">som: ligado</button>
  <div class="rotulo" id="rotulo" hidden></div>
  <div class="mira" aria-hidden="true"></div>

  <div class="dica" id="dica" aria-live="polite">
    <b id="tituloNome">EXPLORADOR</b>
    <span id="tituloSub">clique na porta para entrar</span>
    <div class="setas" id="setas" aria-hidden="true" hidden><i></i><i></i><i></i></div>
  </div>

  <div class="joystick" id="joystick" hidden aria-label="joystick para andar"><div class="pino" id="pino"></div></div>

  <!-- recebem o teclado do formulário de papel (inclusive o do celular) -->
  <input class="campo-escondido" id="campoNome" type="text" autocomplete="name" aria-label="seu nome" maxlength="32" />
  <textarea class="campo-escondido" id="campoMensagem" aria-label="sua mensagem" maxlength="220"></textarea>

  <div class="carregando" id="carregando">apontando o lápis…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
