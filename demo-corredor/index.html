<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corredor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="palco" aria-label="Corredor desenhado a nanquim; role para andar, use WASD para andar livre e clique nas portas para entrar nas salas"></div>
  <div id="rolagem"></div>

  <div class="assinatura">Murilo <span>· corredor</span></div>
  <div class="sala" id="sala"></div>
  <div class="controles">
    <button id="modo" type="button">[WASD] andar livre</button>
    <div class="dicas-livre" id="dicasLivre" hidden>mouse olha · shift corre · clique interage · esc solta o mouse</div>
  </div>
  <button class="voltar" id="voltar" type="button" hidden>← voltar ao corredor</button>
  <button class="voltar" id="pular" type="button" hidden>← sair do voo</button>
  <div class="voo-dica" id="vooDica" hidden><span class="rodinha" aria-hidden="true"><i></i></span><b id="vooDicaTexto"></b></div>
  <div class="nevoa" id="nevoa"></div>
  <div class="leitor" id="leitor" hidden>
    <div class="folha-leitor" role="dialog" aria-modal="true">
      <button class="fechar" type="button" aria-label="fechar">✕</button>
      <small id="leitorTopo"></small>
      <h2 id="leitorTitulo"></h2>
      <p id="leitorTexto"></p>
      <a id="leitorLink" target="_blank" rel="noopener" hidden></a>
    </div>
  </div>
  <button class="som" id="som" type="button" aria-pressed="true">som: ligado</button>
  <div class="rotulo" id="rotulo" hidden></div>
  <div class="mira" aria-hidden="true"></div>

  <div class="dica" id="dica" aria-live="polite">
    <b id="tituloNome">EXPLORADOR</b>
    <span id="tituloSub">clique na porta para entrar</span>
    <div class="setas" id="setas" aria-hidden="true" hidden><i></i><i></i><i></i></div>
  </div>

  <div class="joystick" id="joystick" hidden aria-label="joystick para andar"><div class="pino" id="pino"></div></div>

  <!-- recebem o teclado do formulário de papel (inclusive o do celular) -->
  <input class="campo-escondido" id="campoNome" type="text" autocomplete="name" aria-label="seu nome" maxlength="32" />
  <textarea class="campo-escondido" id="campoMensagem" aria-label="sua mensagem" maxlength="220"></textarea>

  <div class="carregando" id="carregando">
    <div class="apontador" id="apontador">
      <svg viewBox="0 0 340 120" aria-hidden="true">
        <!-- o lápis entra no apontador girando (as listras correm) e tremendo -->
        <g class="lapis-entrando">
          <path d="M96 60 L132 46 L132 74 Z" fill="#e9c9a0" stroke="#2c2c2c" stroke-width="2.5" stroke-linejoin="round" />
          <rect x="132" y="46" width="150" height="28" fill="#f2c94c" stroke="#2c2c2c" stroke-width="2.5" />
          <line class="listras" x1="132" y1="55" x2="282" y2="55" stroke="#2c2c2c" stroke-width="1.5" opacity=".4" />
          <line class="listras" x1="132" y1="65" x2="282" y2="65" stroke="#2c2c2c" stroke-width="1.5" opacity=".4" />
          <rect x="282" y="46" width="16" height="28" fill="#c9c9c9" stroke="#2c2c2c" stroke-width="2.5" />
          <rect x="298" y="46" width="22" height="28" rx="6" fill="#e8a0a0" stroke="#2c2c2c" stroke-width="2.5" />
        </g>
        <!-- apontador de metal por cima da ponta -->
        <path d="M60 34 L140 34 Q148 34 148 42 L148 78 Q148 86 140 86 L60 86 Q52 86 52 78 L52 42 Q52 34 60 34 Z" fill="#d6d6d6" stroke="#2c2c2c" stroke-width="2.5" />
        <path d="M70 42 L132 42" stroke="#2c2c2c" stroke-width="1.5" opacity=".35" />
        <rect x="70" y="30" width="44" height="8" rx="2" fill="#bdbdbd" stroke="#2c2c2c" stroke-width="2.5" />
        <circle cx="92" cy="34" r="3" fill="#2c2c2c" />
        <path d="M140 46 L148 46 L148 74 L140 74" fill="#9e9e9e" stroke="#2c2c2c" stroke-width="2.5" />
      </svg>
      <span>apontando o lápis…</span>
    </div>
  </div>
  <script>
    // raspas de madeira espirrando do apontador enquanto carrega
    (() => {
      const caixa = document.getElementById('apontador');
      const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const cores = ['#e9c9a0', '#e2b98c', '#f2c94c'];
      const espirra = () => {
        if (document.getElementById('carregando').classList.contains('pronto')) return;
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        r.setAttribute('viewBox', '0 0 24 16');
        r.setAttribute('class', 'raspa');
        const cor = cores[Math.floor(Math.random() * cores.length)];
        // raspa enroladinha: uma tira ondulada com a borda escura (a casca pintada do lápis)
        r.innerHTML = `<path d="M2 12 Q6 2 12 7 T22 5" fill="none" stroke="#2c2c2c" stroke-width="5.5" stroke-linecap="round"/><path d="M2 12 Q6 2 12 7 T22 5" fill="none" stroke="${cor}" stroke-width="3" stroke-linecap="round"/>`;
        caixa.appendChild(r);
        // sempre para a esquerda, para fora do desenho, e caem só até a altura do apontador (nunca no texto)
        const alto = 30 + Math.random() * 45, longe = 70 + Math.random() * 120;
        const giro = (Math.random() - 0.5) * 900;
        r.animate([
          { transform: 'translate(0, 0) rotate(0deg) scale(.6)', opacity: 1 },
          { transform: `translate(${-longe * 0.45}px, ${-alto}px) rotate(${giro * 0.5}deg) scale(1)`, opacity: 1, offset: 0.4 },
          { transform: `translate(${-longe}px, ${40 + Math.random() * 20}px) rotate(${giro}deg) scale(1)`, opacity: 0 },
        ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => r.remove();
        setTimeout(espirra, 90 + Math.random() * 140);
      };
      if (!reduz) espirra();
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
