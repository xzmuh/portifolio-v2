<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corredor de Papel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fundo: #ebe3d5;
      --tinta: #2b2622;
      --suave: #7a6c5d;
      --destaque: #5b8fd6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: Roboto, system-ui, sans-serif; }
    #cena { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #rolagem { height: 900vh; }

    .ui { position: fixed; inset: 0; pointer-events: none; }
    .marca { position: absolute; top: 20px; left: 16px; font-weight: 500; font-size: 14px; letter-spacing: .02em; }
    .marca span { color: var(--suave); font-weight: 400; }
    .sala { position: absolute; top: 14px; right: 16px; font: 700 30px Caveat, cursive; }
    .barra { position: absolute; right: 20px; top: 70px; bottom: 70px; width: 2px; background: rgba(43,38,34,.15); border-radius: 2px; }
    .barra i { position: absolute; inset: 0; background: var(--destaque); transform-origin: top; transform: scaleY(0); border-radius: 2px; }
    .dica { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); font: 700 26px Caveat, cursive; transition: opacity .6s; animation: flutua 2s ease-in-out infinite; white-space: nowrap; }
    .dica.some { opacity: 0; }
    @keyframes flutua { 50% { transform: translate(-50%, 6px); } }

    .carregando { position: fixed; inset: 0; display: grid; place-items: center; background: var(--fundo); font: 700 32px Caveat, cursive; transition: opacity .8s; z-index: 2; }
    .carregando.pronto { opacity: 0; pointer-events: none; }

    @media (prefers-reduced-motion: reduce) { .dica { animation: none; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>
<body>
  <canvas id="cena" aria-label="Corredor ilustrado em 3D que se pinta conforme você rola a página"></canvas>
  <div id="rolagem"></div>

  <div class="ui">
    <div class="marca">Murilo · <span>corredor de papel (demo)</span></div>
    <div class="sala" id="nomeSala">Entrada</div>
    <div class="barra"><i id="progresso"></i></div>
    <div class="dica" id="dica">role para entrar ↓</div>
  </div>
  <div class="carregando" id="carregando">afiando o lápis…</div>

  <script type="module" src="main.js"></script>
</body>
</html>
